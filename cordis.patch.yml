# Gitea 任务 issues（@dongasai/dsh-gitea-task-issues）
#
# 一个 bundle 两半：
#   - Host 半边（index.js）注册一条桥接路由 POST /gitea-task-issues/api，
#     持有服务器清单、工作区↔仓库绑定与 Gitea 令牌，并把 gitea_* 工具注册给模型；
#   - 浏览器半边（client.js，由 package.json 的 dsh.client 声明）注册全局看板页、
#     左侧栏面板图标与右侧栏「Gitea issues」看板页签。
#
# 只插入一行插件；浏览器半边由 dsh-client-modules 扫描同一行的 dsh.client 得到，
# 不在这里重复注册。
- insert:
    - id: gitea-task-issues
      name: '@dongasai/dsh-gitea-task-issues'
